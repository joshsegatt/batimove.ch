      <h1 style="font-size:24px;font-weight:800;color:#0B1E33;margin-bottom:12px;">Batimove Sàrl — Déménagement à Genève, Lausanne &amp; Vaud</h1>
      <p style="font-size:15px;margin-bottom:16px;">Batimove Sàrl est une entreprise suisse de déménagement et transport pour particuliers et entreprises à Genève, Lausanne et dans l'ensemble du canton de Vaud. Nous assurons un service complet : déménagement résidentiel, transfert d'entreprise, garde-meubles sécurisé, débarras écologique et nettoyage de fin de bail avec garantie remise des clés pour l'état des lieux.</p>
      
      <h2 style="font-size:18px;font-weight:700;color:#0B1E33;margin-top:20px;margin-bottom:8px;">Nos Prestations Professionnelles</h2>
      <ul>
        <li><strong>Déménagement Résidentiel :</strong> Emballage soigné de vos meubles et effets personnels, démontage et remontage, transport capitonné et assurance RC jusqu'à CHF 5'000'000.</li>
        <li><strong>Transfert d'Entreprise &amp; Bureaux :</strong> Planification sur-mesure, transfert informatique et archives, zéro interruption d'activité.</li>
        <li><strong>Garde-Meubles Sécurisé :</strong> Stockage ventilé sous scellés et accès sécurisé à Genève.</li>
        <li><strong>Nettoyage État des Lieux :</strong> Nettoyage de fin de bail 100% garanti conforme aux exigences des régies immobilières suisses.</li>
        <li><strong>Débarras &amp; Tri Écologique :</strong> Valorisation des biens, évacuation et recyclage certifié.</li>
      </ul>

      <h2 style="font-size:18px;font-weight:700;color:#0B1E33;margin-top:20px;margin-bottom:8px;">Tarifs Déménagement Suisse dès CHF 550</h2>
      <p>Nos formules transparentes : Basic (dès CHF 550), Standard (dès CHF 850), Premium (dès CHF 1'500) et Luxe (dès CHF 1'700). Devis gratuit et ferme sous 24h sans aucun frais caché.</p>

      <h2 style="font-size:18px;font-weight:700;color:#0B1E33;margin-top:20px;margin-bottom:8px;">Contact &amp; Siège Social</h2>
